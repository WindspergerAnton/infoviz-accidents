<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InfoVis VU 2026 - Accidents</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/style.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #f5faff 0%, #edf3f9 100%);
            color: #17324d;
        }
        .page-wrap { max-width: 1400px; margin: 0 auto; }
        .page-header {
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(15,23,42,0.08);
            border-radius: 18px;
            padding: 18px 18px 12px;
            box-shadow: 0 10px 28px rgba(15,23,42,0.08);
            margin-bottom: 18px;
        }
        .page-header h1 { margin: 0 0 4px; color: #102538; }
        .page-header p { color: #52657a; margin: 0 0 8px; }
        .nav-link {
            display: inline-block;
            margin-right: 10px;
            color: #2f6fb7;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-link:hover { text-decoration: underline; }
        #models_container { display: flex; gap: 24px; flex-wrap: wrap; margin: 20px 0; }
        .model_card {
            background: rgba(255,255,255,0.96);
            border: 1px solid rgba(15,23,42,0.08);
            border-radius: 16px;
            padding: 16px;
            min-width: 300px;
            box-shadow: 0 10px 26px rgba(15,23,42,0.08);
        }
        .model_card h3 { margin: 0 0 6px 0; color: #102538; }
        .best { border-color: #63b37c; box-shadow: 0 10px 30px rgba(99,179,124,0.14); }
        .f1_total { font-size: 1.05em; font-weight: 700; margin-bottom: 10px; color: #18406e; }
        table { border-collapse: collapse; margin-bottom: 10px; width: 100%; }
        td, th { border: 1px solid #dfe7ef; padding: 5px 10px; text-align: center; font-size: 0.82em; }
        th { background: #edf5ff; color: #17324d; }
        .section_label { font-weight: 700; margin: 10px 0 4px 0; font-size: 0.85em; color: #30455f; }
        #error_map { margin: 20px 0; }
        #error_map svg {
            border: 1px solid rgba(15,23,42,0.10);
            display: block;
            border-radius: 16px;
            background: linear-gradient(145deg, #f8fbff 0%, #edf4fb 55%, #e6eef6 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 24px rgba(15,23,42,0.08);
        }
        .region-outline { fill: #edf3f9; stroke: #a7bfdc; stroke-width: 1; }
        .legend { display: flex; gap: 16px; margin: 8px 0; font-size: 0.9em; color: #30455f; }
        .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="page-header">
        <h1>InfoVis VU 2026 - Exercise 2</h1>
        <p>Group 52 – Road Accident Severity Prediction</p>
        <a class="nav-link" href="/map">→ Interactive Map</a>
        <a class="nav-link" href="/dashboard">→ Dashboard</a>
    </div>

<h2>Model Comparison</h2>
<div id="models_container"></div>

<h2>Prediction Error Map <small style="font-size:0.6em; color:#555">(best model)</small></h2>
<div class="legend">
    <div><span style="background:green"></span>Correct</div>
    <div><span style="background:red"></span>Wrong</div>
</div>
<div id="error_map">
    <svg id="svg_error_map" width="480" height="560"></svg>
</div>

<script>
    const rf = {{ rf | safe }};
    const classes = rf.classes;
    const bestF1 = Math.max(...rf.models.map(m => m.f1));

    // ── Model cards ────────────────────────────────────────────────────────────
    const container = d3.select('#models_container');

    rf.models.forEach(model => {
        const isBest = model.f1 === bestF1;
        const card = container.append('div')
            .attr('class', 'model_card' + (isBest ? ' best' : ''));

        card.append('h3').text(model.name + (isBest ? ' ★' : ''));
        card.append('div').attr('class', 'f1_total').text(`Weighted F1: ${model.f1}`);

        // Confusion matrix
        card.append('div').attr('class', 'section_label').text('Confusion Matrix');
        const cmTable = card.append('table');
        const header = cmTable.append('thead').append('tr');
        header.append('th').text('Actual \\ Pred');
        classes.forEach(c => header.append('th').text(c));
        const tbody = cmTable.append('tbody');
        model.confusion_matrix.forEach((row, i) => {
            const tr = tbody.append('tr');
            tr.append('th').text(classes[i]);
            row.forEach((val, j) => {
                tr.append('td')
                  .style('background', i === j ? '#c8e6c9' : (val > 0 ? '#ffcdd2' : 'white'))
                  .text(val);
            });
        });

        // Per-class metrics
        card.append('div').attr('class', 'section_label').text('Per-Class Metrics');
        const pcTable = card.append('table');
        const pcHead = pcTable.append('thead').append('tr');
        ['Class', 'Precision', 'Recall', 'F1'].forEach(h => pcHead.append('th').text(h));
        const pcBody = pcTable.append('tbody');
        classes.forEach(c => {
            const m = model.per_class[c];
            const tr = pcBody.append('tr');
            tr.append('td').text(c);
            tr.append('td').text(m.precision);
            tr.append('td').text(m.recall);
            tr.append('td').text(m.f1);
        });
    });

    // ── Error Map ──────────────────────────────────────────────────────────────
    const svg = d3.select('#svg_error_map');
    const width = +svg.attr('width');
    const height = +svg.attr('height');
    const points = rf.error_map;

    // Approximate WGS84 (lon/lat) → EPSG:27700 (easting/northing) for UK
    // UK bounds: lon [-7.57, 1.76], lat [49.96, 60.86] → OSGB [0..655000, 0..1218000]
    function wgs84ToOSGB(lon, lat) {
        const e = (lon + 7.57) / (1.76 + 7.57) * 655000;
        const n = (lat - 49.96) / (60.86 - 49.96) * 1218000;
        return [e, n];
    }

    d3.json("/static/data/uk-police.json").then(function(uk) {
        const pad = 40;
        const projection = d3.geoIdentity()
            .reflectY(true)
            .fitExtent([[pad, pad], [width - pad, height - pad]], uk);
        const path = d3.geoPath().projection(projection);

        // Clip path matching the region outlines — keeps points inside E&W only
        const defs = svg.append("defs");
        const clip = defs.append("clipPath").attr("id", "regions-clip");
        clip.selectAll("path")
            .data(uk.features)
            .join("path")
            .attr("d", path);

        // Draw region outlines as map background
        svg.append("g")
            .selectAll("path")
            .data(uk.features)
            .join("path")
            .attr("class", "region-outline")
            .attr("d", path);

        // Plot error points clipped to the map outline
        svg.append("g")
            .attr("clip-path", "url(#regions-clip)")
            .selectAll('circle')
            .data(points)
            .join('circle')
            .attr('cx', d => {
                const p = projection(wgs84ToOSGB(d.longitude, d.latitude));
                return p ? p[0] : -10;
            })
            .attr('cy', d => {
                const p = projection(wgs84ToOSGB(d.longitude, d.latitude));
                return p ? p[1] : -10;
            })
            .attr('r', 2)
            .attr('fill', d => d.correct ? 'green' : 'red')
            .attr('opacity', 0.5);
    });
</script>

</div>
</body>
</html>
